<body>

  <main id="main-content" tabindex="-1">
    <h1>Some simple Components</h1>
    <div id="imgTwo">
      <div id="image">
      </div>
      <hgroup id="textTwo"">
      <p id="text">Hover over an image below to display here.</p>  
      <p id="picContent"> Picture's content go here.</p>
      </hgroup>
      
    </div>
    

    <section class="gallery">
      <img id="pic1" 
        class="section"
        src="images/spur-gear.jpg" 
        alt="Spur gear"
        title="Spur gear is the most basic gear it is used to tranfer motion to another component not limited to gear."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">
            
      <img id="pic2" 
        class="section"
        src="images/helical-gear.jpg" 
        alt="Helical Gear"
        title="Helical gear is similar to spur gear but with its teeth angled, it was created to sovle the wear created when two gear mesh into each other."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">
            
      <img id="pic3" 
        class="section"
        src="images/straight-bevel-gear.jpg" 
        alt="Straight bevel Gear"
        title="Bevel gear is designed to tranfer motion and torque at an angle usually 45°. How ever due to its design this type of gear is susceptible to slipping"
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">
            
      <img id="pic4" 
        class="section"
        src="images/spiral-bevel-gear.jpg" 
        alt="Spiral bevel Gear"
        title="spiral bevel gear is a specific type of bevel gear with curved, angled teeth that engage gradually for smooth, quiet, and high-torque power transmission. But is harder to produce as a result."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">

      <img id="pic5" 
        class="section"
        src="images/internal-gear.jpg" 
        alt="internal Gear"
        title="An internal gear is a cylindrical gear with teeth cut on its inner surface rather than the outside."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">

      <img id="pic6" 
        class="section"
        src="images/worm-gear.jpg" 
        alt="Worm gear"
        title="A worm gear is a specific type of gear system made up of a screw-like input shaft called a worm and a toothed output wheel called a worm wheel. It is used to transfers motion between non-intersecting shafts at a 90-degree angle."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">

      <img id="pic7" 
        class="section"
        src="images/worm-wheel.jpg" 
        alt="Worm wheel"
        title="A worm wheel is the output of a worm gear sitting at a 90-degree angle."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">

      <img id="pic8" 
        class="section"
        src="images/ratchet.jpg" 
        alt="Ratchet and pawl"
        title="a mechanical device that allows movement in only one direction. It features a toothed wheel called a ratchet and a pivoting, often spring-loaded finger called a pawl that drops into the teeth to block backward motion."
        tabindex="0"
        role="button"
        onfocus="upDate(this)"
        onblur="undo()"
        onmouseover="upDate(this)"
        onmouseout="undo()"
        onclick="upDateDefaultPic(this)">



    </section>
